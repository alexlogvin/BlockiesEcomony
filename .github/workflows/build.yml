name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nodes:
    # The node list comes from the repo rather than from a copy of it kept here. There is
    # one directory per (Minecraft version x loader) and there are a lot of them; a
    # hardcoded list in two workflows is a list that silently stops matching the tree.
    name: Collect nodes
    runs-on: ubuntu-latest
    outputs:
      nodes: ${{ steps.collect.outputs.nodes }}
    steps:
      - uses: actions/checkout@v4
      - id: collect
        run: |
          # Built with sed and paste rather than jq so the quoting is identical in a local
          # shell and can be checked without pushing.
          nodes="[$(ls versions | sed 's/.*/"&"/' | paste -sd, -)]"
          echo "nodes=$nodes" >> "$GITHUB_OUTPUT"
          echo "Building: $nodes"

  core:
    # The pure-Java library carries the solver, the ledger and the wire format, and needs no
    # Minecraft at all. Running it on its own gives a real answer in under a minute, rather
    # than after twenty minutes of remapping.
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: core-test-report
          path: core/build/reports/tests/test

  jars:
    name: ${{ matrix.node }}
    needs: [nodes, core]
    runs-on: ubuntu-latest
    strategy:
      # Every node is independent, so one loader breaking should still tell us about the
      # others rather than cancelling them.
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.nodes.outputs.nodes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build ${{ matrix.node }}
        run: ./gradlew :${{ matrix.node }}:build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.node }}
          path: versions/${{ matrix.node }}/build/libs/*.jar
          if-no-files-found: error
