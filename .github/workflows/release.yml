name: Release

# Pushing a tag like v0.1.0 builds every jar and publishes them.
#
# Publishing is skipped silently when the relevant secret is missing, so a fork can cut its
# own tagged builds and get the jars as artifacts without holding any tokens.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and attach jars, but do not publish
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 1.20.1-fabric
          - 1.20.1-forge
          - 1.20.1-quilt
          - 1.21.1-fabric
          - 1.21.1-neoforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test :${{ matrix.node }}:build
      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.node }}
          path: versions/${{ matrix.node }}/build/libs/*.jar
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    # A dry run still produces every jar; it just stops before anything leaves the repo.
    if: github.event_name == 'push' || !inputs.dry_run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          merge-multiple: true
          path: release
      - name: Drop sources jars
        run: rm -f release/*-sources.jar
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.jar
          generate_release_notes: true
      - name: Modrinth and CurseForge
        # Not wired yet. mod-publish-plugin needs a Modrinth project id and a CurseForge
        # project id, neither of which exists until the pages are created — so this step
        # states that plainly instead of calling a task that is not configured.
        # See PLAN.md M14.4.
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ] && [ -z "$CURSEFORGE_TOKEN" ]; then
            echo "No publishing tokens configured; the GitHub release above is the output."
          else
            echo "::warning::Tokens are present but mod-publish-plugin is not configured yet."
            echo "Create the Modrinth and CurseForge projects, then wire the plugin (PLAN.md M14.4)."
          fi
