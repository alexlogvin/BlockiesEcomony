name: Release

# Pushing a tag like v0.1.0 builds every jar and publishes them to GitHub, Modrinth and
# CurseForge.
#
# A platform is skipped silently when its token is missing or its project id is not
# configured, so a fork can cut its own tagged builds and get the jars as artifacts without
# holding any credentials. See gradle.properties for the ids.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and attach jars, but do not publish
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 1.20.1-fabric
          - 1.20.1-forge
          - 1.21.1-fabric
          - 1.21.1-neoforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test :${{ matrix.node }}:build
      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.node }}
          path: versions/${{ matrix.node }}/build/libs/*.jar
          if-no-files-found: error

  publish:
    name: Publish
    # Every node must build before anything is published, so a broken loader cannot leave
    # three of four versions live on the sites.
    needs: build
    runs-on: ubuntu-latest
    # A dry run still produces every jar; it just stops before anything leaves the repo.
    if: github.event_name == 'push' || !inputs.dry_run
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog is built from the commits since the previous tag, which needs
          # the tags and the history behind them.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: artifacts

      - name: Lay the jars out where Gradle and the release expect them
        run: |
          set -euo pipefail
          # publishMods reads versions/<node>/build/libs/, and it deliberately does not
          # depend on the jar tasks — so putting the built jars back here is what makes it
          # upload the exact bytes the build jobs tested, without rebuilding them.
          for dir in artifacts/jar-*; do
            node="${dir#artifacts/jar-}"
            mkdir -p "versions/$node/build/libs"
            cp "$dir"/*.jar "versions/$node/build/libs/"
          done

          mkdir -p release
          cp artifacts/jar-*/*.jar release/
          # Sources jars are useful from the repo, not as release downloads where they sit
          # next to the real jar and get installed by mistake.
          rm -f release/*-sources.jar
          ls -l release

      - name: Changelog from the commits since the previous tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          previous="$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            range="$previous..$tag"
          else
            # First release: everything is new, but the whole history would be noise.
            range="$(git rev-list --max-parents=0 HEAD | tail -1)..$tag"
          fi
          {
            echo "RELEASE_CHANGELOG<<CHANGELOG_EOF"
            git log --no-merges --pretty='- %s' "$range"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_ENV"

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.jar
          generate_release_notes: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v4

      - name: Modrinth and CurseForge
        # Skipped entirely with no tokens, so the GitHub release above is still the output
        # for a fork. Each platform is skipped individually inside Gradle when its project
        # id is blank.
        if: env.MODRINTH_TOKEN != '' || env.CURSEFORGE_TOKEN != ''
        run: ./gradlew publishMods

      - name: No tokens configured
        if: env.MODRINTH_TOKEN == '' && env.CURSEFORGE_TOKEN == ''
        run: echo "No publishing tokens set; the GitHub release above is the output."
