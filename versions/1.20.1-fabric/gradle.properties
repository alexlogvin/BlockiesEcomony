# 1.20 and 1.20.1. Still NOT "~1.20.1": Fabric reads that as >=1.20.1 <1.22.0, so the jar
# would claim 1.20.2 and beyond, where the recipe and networking APIs it reads have moved.
#
# 1.20 is in the range because the two are provably the same target: built against either,
# every class in the remapped jar comes out byte-identical. The Forge node stays on 1.20.1
# alone, because Forge for 1.20 is a different major (46 against 47).
meta.mc_range_semver = >=1.20 <1.20.2
meta.mc_versions = 1.20, 1.20.1
deps.modmenu = 7.2.2
