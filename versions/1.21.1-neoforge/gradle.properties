# Minecraft 1.21.1 / NeoForge. Java 21.
deps.neoforge = 21.1.251
deps.parchment_mc = 1.21.1
deps.parchment = 2024.11.17
meta.pack_format = 34
meta.mc_range_maven = [1.21,1.21.2)

# Which versions the download pages list. Derived from the node name when absent, which
# is right for a node covering one version and wrong for one covering a span.
meta.mc_versions = 1.21, 1.21.1
# 21.0 is NeoForge for Minecraft 1.21, which this jar also supports. The mod uses nothing
# NeoForge added in 21.1: built against either, every class comes out byte-identical.
meta.loader_range = [21.0,)

# The javafml LANGUAGE PROVIDER version, which is not the NeoForge version.
# NeoForge 21.1 ships javafml 4.x; getting this wrong makes the mod refuse to load
# with "Missing language javafml version ... found 4.0.44".
meta.javafml_range = [4,)
