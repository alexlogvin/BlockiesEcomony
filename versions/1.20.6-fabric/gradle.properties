# Minecraft 1.20.5-1.20.6 / Fabric. Java 21.
#
# Built against 1.20.6 and declared for 1.20.5 too: the two produce byte-identical
# remapped jars, so a separate 1.20.5 build would ship the same bytes under another name.
deps.fabric_loader = 0.19.5
deps.fabric_api = 0.100.8+1.20.6
meta.pack_format = 32
meta.mc_range_semver = >=1.20.5 <1.21
meta.mc_versions = 1.20.5, 1.20.6

# The same source as the 1.21 node. See versions/1.21.1-fabric/gradle.properties.
meta.src_era = 1.20.5

# No stable Parchment for this version, only nightlies. Mojmap alone, so parameter names
# read as p_12345_ in an IDE and nothing else differs.
deps.modmenu = 10.0.0-beta.1
