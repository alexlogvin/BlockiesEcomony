# Minecraft 1.20.1 / Quilt. Java 17.
#
# A Quilt build is a Fabric-shaped mod that ships quilt.mod.json and runs on Quilt
# Loader. It therefore COMPILES against Fabric Loader: Quilt Standard Libraries,
# Quilt Kotlin Libraries and Quilted Fabric API were all retired in Dec 2025, and
# Quilt publishes no Mixin artifact of its own. Quilt Loader's Fabric compatibility
# layer is the supported target now.
deps.fabric_loader = 0.19.5
deps.fabric_api = 0.92.12+1.20.1
deps.quilt_loader = 0.31.0-beta.4
deps.parchment_mc = 1.20.1
deps.parchment = 2023.09.03
meta.pack_format = 15
meta.mc_range_semver = ~1.20.1
