# Minecraft 1.21.1 / Fabric. Java 21.
deps.fabric_loader = 0.19.5
deps.fabric_api = 0.116.17+1.21.1
deps.parchment_mc = 1.21.1
deps.parchment = 2024.11.17
meta.pack_format = 34
# 1.21 and 1.21.1, matching what the NeoForge node declares. Still NOT "~1.21.1": Fabric
# reads that as >=1.21.1 <1.22.0, so the jar would claim every 1.21.x - including 1.21.2,
# where recipes became a datapack registry and the price engine could not read them at all.
#
# 1.21 is in the range because the two versions are provably the same target, not because
# they look close: built against either, every class in the remapped jar comes out
# byte-identical, so there is literally nothing for a second jar to contain.
meta.mc_range_semver = >=1.21 <1.21.2

# Which versions the download pages list. Derived from the node name when absent, which
# is right for a node covering one version and wrong for one covering a span.
meta.mc_versions = 1.21, 1.21.1
deps.modmenu = 11.0.3

# Shares its source with the 1.20.5 node: one file compiles correctly against both eras,
# because the only difference is Fabric API's HUD callback parameter and that is a lambda
# whose type is inferred. Only the emitted bytecode differs, which is why they are still
# two jars.
meta.src_era = 1.20.5
