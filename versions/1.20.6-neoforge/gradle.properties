# Minecraft 1.20.6 / NeoForge. Java 21.
#
# 1.20.6 alone, not the 1.20.5-1.20.6 span the Fabric node covers: NeoForge never cut a
# stable 1.20.5 build, only 20.5.21-beta, so there is no release to declare support for.
deps.neoforge = 20.6.141
meta.pack_format = 32
meta.mc_range_maven = [1.20.6,1.21)
meta.loader_range = [20.6,)
# The javafml LANGUAGE PROVIDER version, which is not the NeoForge version. NeoForge 20.6
# ships FancyModLoader 3.0.45, where 21.0 ships 4.0.23 - so this is [3,) and the 1.21 node
# is [4,). Getting it wrong makes the mod refuse to load.
meta.javafml_range = [3,)

# The same source as the 1.21 node. See versions/1.21.1-fabric/gradle.properties.
meta.src_era = 1.20.5
