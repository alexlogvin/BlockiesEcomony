# ---------------------------------------------------------------------------
# Mod identity
# ---------------------------------------------------------------------------
mod_id = blockies_economy

# The jar file name. Deliberately NOT mod_id: the id is a namespace, used for asset
# paths, translation keys, the config directory and the network channel, and changing it
# would break every one of those and every existing config. The file name is just a file
# name, and blockieseconomy matches the Modrinth and CurseForge slugs.
mod_archive_name = blockieseconomy
mod_name = Blockies Economy
mod_version = 0.1.0
mod_group = com.alexlogvin.blockieseconomy
mod_author = Alex Logvin
mod_license = MIT
mod_description = A server-authoritative economy mod. Earn Blockies from advancements and \
  selling items, spend them in a vanilla-styled shop. Prices are derived automatically from \
  the game's own recipe tree, so modded items are priced without manual work.

mod_homepage = https://github.com/alexlogvin/BlockiesEcomony
mod_sources  = https://github.com/alexlogvin/BlockiesEcomony
mod_issues   = https://github.com/alexlogvin/BlockiesEcomony/issues

# ---------------------------------------------------------------------------
# Publishing
# ---------------------------------------------------------------------------
# Modrinth takes the slug or the id; the slug is stable and readable.
publish.modrinth_id = blockieseconomy

# CurseForge needs the NUMERIC project id, not the slug: uploads go to
# /api/projects/<id>/upload-file. It is on the project page under "Project ID",
# in the About box on the right. Leave blank and CurseForge is skipped entirely,
# which is what a fork without a CurseForge page wants.
publish.curseforge_id = 1702666
publish.curseforge_slug = blockieseconomy

# ---------------------------------------------------------------------------
# Gradle
# ---------------------------------------------------------------------------
# Decompiling and remapping Minecraft is memory-hungry; 4G avoids OOM on the
# first run of each node.
org.gradle.jvmargs = -Xmx4G -XX:MaxMetaspaceSize=1G
org.gradle.parallel = true
org.gradle.caching = true

# The daemon JVM is pinned to Java 21 in gradle/gradle-daemon-jvm.properties,
# so the build does not depend on a correct JAVA_HOME. Individual nodes select
# their own compile level via toolchains (17 for 1.20.x, 21 for 1.21.x, 25 for 26.x).
org.gradle.java.installations.auto-detect = true
org.gradle.java.installations.auto-download = true

# Left off deliberately: Loom's Minecraft-provider tasks have a history of
# configuration-cache incompatibility. Revisit once the full tree builds.
org.gradle.configuration-cache = false
